<!DOCTYPE html>
<html>

<head>
    <title>BuddyConnect Dashboard</title>
</head>

<body>

    <h1>🏠 BuddyConnect Dashboard</h1>

    <hr>

    <h2>Welcome <span id="username"></span></h2>

    <img id="profileImage" width="150">

    <p>Email: <span id="email"></span></p>
    <p>Phone: <span id="phone"></span></p>
    <p>City: <span id="city"></span></p>

    <br>

    <button onclick="window.location='/api/profile-page/'">
        Edit Profile
    </button>

    <button onclick="window.location='/api/discover/'">
        ❤️ Discover
    </button>

    <button onclick="logout()">
        Logout
    </button>

    <hr>

    <h2>💕 My Matches</h2>

    <div id="matchesList"></div>

    <hr>

    <h2>❤️ Who Liked You</h2>

    <div id="likesReceived"></div>

    <h2>👥 My Friends</h2>

    <div id="friendsList"></div>

    <hr>

    <h2>Friend Requests</h2>

    <div id="friendRequests"></div>

    <hr>

    <h2>All Users</h2>

    <div id="usersList"></div>

    <script>

        const token = localStorage.getItem("access");

        async function loadProfile() {

            const response = await fetch("/api/profile/", {
                headers: {
                    Authorization: "Bearer " + token
                }
            });

            const data = await response.json();

            document.getElementById("username").innerHTML = data.username;
            document.getElementById("email").innerHTML = data.email;
            document.getElementById("phone").innerHTML = data.phone;
            document.getElementById("city").innerHTML = data.city;

            if (data.profile_picture) {
                document.getElementById("profileImage").src = data.profile_picture;
            }

        }

        async function loadUsers() {

            const response = await fetch("/api/users/", {
                headers: {
                    Authorization: "Bearer " + token
                }
            });

            const users = await response.json();

            let html = "";

            users.forEach(user => {

                html += `
        <div style="border:1px solid gray;padding:10px;margin:10px;">

            <h3>${user.username}</h3>

            <p>${user.city}</p>

            <button onclick="sendRequest(${user.id})">
                Add Friend
            </button>

        </div>
        `;

            });

            document.getElementById("usersList").innerHTML = html;

        }

        async function sendRequest(receiverId) {

            const response = await fetch("/api/friend-request/", {

                method: "POST",

                headers: {
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    receiver: receiverId
                })

            });

            if (response.ok) {

                alert("✅ Friend Request Sent");

                loadFriendRequests();
                loadFriends();

            }
            else {

                alert("❌ Request Failed");

            }

        }

        async function loadFriendRequests() {

            const response = await fetch("/api/friend-requests/", {

                headers: {
                    "Authorization": "Bearer " + token
                }

            });

            const requests = await response.json();

            console.log(requests);

            let html = "";

            requests.forEach(request => {

                html += `
        <div style="border:1px solid green;padding:10px;margin:10px;">

            <h3>${request.sender.username}</h3>

            <button onclick="acceptRequest(${request.id})">
                Accept
            </button>

        </div>
        `;

            });

            document.getElementById("friendRequests").innerHTML = html;

        }

        async function acceptRequest(id) {

            const response = await fetch(`/api/friend-request/${id}/accept/`, {

                method: "PUT",

                headers: {
                    "Authorization": "Bearer " + token
                }

            });

            if (response.ok) {

                alert("✅ Friend Request Accepted");

                loadFriendRequests();
                loadFriends();

            } else {

                alert("❌ Failed");

            }

        }

        function logout() {

            localStorage.removeItem("access");

            window.location = "/api/login-page/";

        }

        loadProfile();
        loadUsers();
        loadFriendRequests();
        loadFriends();
        loadLikesReceived();
        loadMatches();
        testUnread();

        async function loadFriends() {

            const response = await fetch("/api/friends/", {
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            const friends = await response.json();

            let html = "";

            const unreadResponse = await fetch('/api/unread-messages/', {
                headers: {
                    Authorization: 'Bearer ' + token
                }
            });

            const unreadData = await unreadResponse.json();

            friends.forEach(friend => {

                let user;

                if (friend.sender.username == document.getElementById("username").innerHTML) {
                    user = friend.receiver;
                } else {
                    user = friend.sender;
                }

                const unreadCount = unreadData[user.id] || 0;

                html += `
        <div style="border:1px solid blue;padding:10px;margin:10px;border-radius:8px;">

            <img src="${user.profile_picture}" width="80" height="80">

            <h3>
                ${user.username}
                ${unreadCount > 0
                        ? `<span style="
                        background:red;
                        color:white;
                        padding:3px 8px;
                        border-radius:50%;
                        font-size:12px;
                        margin-left:5px;
                     ">${unreadCount}</span>`
                        : ""}
            </h3>

            <p>${user.email}</p>

            <p>${user.city}</p>

            <button onclick="window.location='/api/chat/?user=${user.id}'">
                Chat
            </button>

        </div>
        `;

            });

            document.getElementById("friendsList").innerHTML = html;

        }

        async function testUnread() {

            console.log("Function Started");

            const response = await fetch("/api/unread-messages/", {
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            console.log("Status:", response.status);

            const data = await response.json();

            console.log("Response:", data);

        }

        async function loadLikesReceived() {

            const response = await fetch("/api/likes-received/", {
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (!response.ok) {
                console.log("Cannot load likes:", response.status);
                return;
            }

            const likes = await response.json();

            console.log("❤️ Likes Received:", likes);

            let html = "";

            likes.forEach(like => {

                const user = like.user;

                html += `
            <div style="
                border:1px solid #ff4d6d;
                padding:15px;
                margin:10px;
                border-radius:12px;
                width:300px;
            ">

                <img
                    src="${user.profile_picture || ''}"
                    width="80"
                    height="80"
                    style="border-radius:50%;object-fit:cover;"
                >

                <h3>${user.username} ❤️</h3>

                <p>${user.city}</p>

                ${like.liked_back
                        ?
                        `<p style="color:green;">
                        ❤️ You already liked each other
                    </p>`
                        :
                        `
                    <button onclick="likeBack(${user.id})">
                        ❤️ Like Back
                    </button>

                    <button onclick="passLike(${like.like_id})">
                        ❌ Pass
                    </button>
                    `
                    }

            </div>
        `;
            });

            if (likes.length === 0) {

                html = `
            <p>
                No new likes yet ❤️
            </p>
        `;
            }

            document.getElementById("likesReceived").innerHTML = html;
        }

        async function likeBack(userId) {

            const response = await fetch(`/api/like/${userId}/`, {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            const data = await response.json();

            console.log("❤️ Like Back Response:", data);

            if (data.matched) {

                alert("❤️ It's a Match!");

            } else {

                alert("❤️ Like sent!");

            }

            loadLikesReceived();
        }

        function passLike(likeId) {

            alert("❌ Pass feature next step mein add karenge.");

        }

        async function loadMatches() {

            const response = await fetch("/api/matches/", {
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (!response.ok) {
                console.log("Cannot load matches:", response.status);
                return;
            }

            const matches = await response.json();

            console.log("💕 Matches:", matches);

            let html = "";

            matches.forEach(match => {

                const user = match.user;

                html += `
            <div style="
                border:2px solid #ff4d6d;
                padding:15px;
                margin:10px;
                border-radius:15px;
                width:300px;
            ">

                <img
                    src="${user.profile_picture || ''}"
                    width="100"
                    height="100"
                    style="
                        border-radius:50%;
                        object-fit:cover;
                    "
                >

                <h3>💕 You matched with ${user.username}!</h3>

                <p>${user.city}</p>

                <button onclick="window.location='/api/chat/?user=${user.id}'">
                    💬 Chat
                </button>

                <button onclick="unmatch(${match.match_id})">
                    💔 Unmatch
                </button>

            </div>
        `;
            });

            if (matches.length === 0) {

                html = `
            <p>No matches yet. Keep discovering! ❤️</p>
        `;
            }

            document.getElementById("matchesList").innerHTML = html;
        }

        async function unmatch(matchId) {

            const confirmUnmatch = confirm(
                "Are you sure you want to unmatch?"
            );

            if (!confirmUnmatch) {
                return;
            }

            const response = await fetch(
                `/api/unmatch/${matchId}/`,
                {
                    method: "DELETE",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

            const data = await response.json();

            if (response.ok) {

                alert("💔 Unmatched successfully");

                loadMatches();
                loadLikesReceived();

            } else {

                alert(data.error || "Unmatch failed");

            }
        }

    </script>

</body>

</html>
