<!DOCTYPE html>
<html>

<head>
    <title>BuddyConnect Chat</title>

    <style>
        body {
            font-family: Arial;
            width: 700px;
            margin: auto;
        }

        #messages {
            height: 450px;
            border: 1px solid #ccc;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
            background: #f5f5f5;
        }

        .my-message {
            text-align: right;
            margin: 10px;
        }

        .friend-message {
            text-align: left;
            margin: 10px;
        }

        .bubble {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 300px;
        }

        .my-message .bubble {
            background: #007bff;
            color: white;
        }

        .friend-message .bubble {
            background: #dddddd;
            color: black;
        }

        input {
            width: 80%;
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <h2>💬 BuddyConnect Chat</h2>

    <hr>

    <div id="messages"></div>

    <input type="text" id="message" placeholder="Type your message...">

    <button onclick="sendMessage()">
        Send
    </button>

    <script>

        const token = localStorage.getItem("access");

        const params = new URLSearchParams(window.location.search);

        const friendId = params.get("user");

        let myId = "";
        let myUsername = "";

        async function loadProfile() {

            const response = await fetch("/api/profile/", {

                headers: {
                    "Authorization": "Bearer " + token
                }

            });

            const data = await response.json();

            myUsername = data.username;
            myId = data.id;

        }

        async function loadMessages() {

            const response = await fetch(`/api/messages/${friendId}/`, {

                headers: {
                    "Authorization": "Bearer " + token
                }

            });

            if (!response.ok) {
                console.log("Cannot Load Messages");
                return;
            }

            const messages = await response.json();

            let html = "";

            messages.forEach(msg => {

                if (msg.sender.username == myUsername) {

                    html += `
            <div class="my-message">

                <div class="bubble">
                    ${msg.message}
                </div>

            </div>
            `;

                }

                else {

                    html += `
            <div class="friend-message">

                <div class="bubble">
                    <b>${msg.sender.username}</b><br>
                    ${msg.message}
                </div>

            </div>
            `;

                }

            });

            document.getElementById("messages").innerHTML = html;

            document.getElementById("messages").scrollTop =
                document.getElementById("messages").scrollHeight;

        }

        async function sendMessage() {

            const message = document.getElementById("message").value.trim();

            if (message === "") {
                return;
            }

            // Database me save karo
            await fetch("/api/messages/", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    receiver: friendId,
                    message: message
                })
            });

            // WebSocket se live bhejo
            socket.send(JSON.stringify({
                sender: myUsername,
                message: message
            }));

            document.getElementById("message").value = "";
        }

        async function startChat() {

            await loadProfile();

            const roomName =
                Number(myId) < Number(friendId)
                    ? `${myId}_${friendId}`
                    : `${friendId}_${myId}`;

            window.socket = new WebSocket(
                "ws://" + window.location.host + "/ws/chat/" + roomName + "/"
            );

            socket.onopen = function () {
                console.log("✅ WebSocket Connected");
            };

            socket.onclose = function () {
                console.log("❌ WebSocket Closed");
            };

            socket.onmessage = function (event) {

                const data = JSON.parse(event.data);

                let html = "";

                if (data.sender == myUsername) {

                    html = `
            <div class="my-message">
                <div class="bubble">
                    ${data.message}
                </div>
            </div>
            `;

                } else {

                    html = `
            <div class="friend-message">
                <div class="bubble">
                    <b>${data.sender}</b><br>
                    ${data.message}
                </div>
            </div>
            `;

                }

                document.getElementById("messages").innerHTML += html;

                document.getElementById("messages").scrollTop =
                    document.getElementById("messages").scrollHeight;

            };

            loadMessages();

        }

        startChat();

    </script>

</body>

</html>
